services:
  - type: web
    name: miranda-insights
    runtime: python
    rootDir: current_website
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: WEB_CONCURRENCY
        value: 1
      - key: SUPABASE_STORAGE_ENABLED
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_QUERYSTRING_EXPIRE
        value: "604800"
      - key: SURVEYHQ_DURABLE_STORAGE_READY
        sync: false
    buildCommand: >-
      pip install -r requirements.txt
      && npm ci
      && npm run build:css
      && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate
      && python manage.py ensure_superuser
      && gunicorn landingpage.wsgi:application
      --worker-class gthread
      --workers 1
      --threads 2
      --timeout 120
      --access-logfile -
      --error-logfile -
  - type: worker
    name: miranda-insights-outbound-worker
    runtime: python
    rootDir: current_website
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: SUPABASE_STORAGE_ENABLED
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_QUERYSTRING_EXPIRE
        value: "604800"
      - key: SURVEYHQ_DURABLE_STORAGE_READY
        sync: false
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_outbound_jobs --loop --sleep 5
